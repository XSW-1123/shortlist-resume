# 单页中文简历 · 唯一内容源
# 规则见 references/rulebook.md R1–R18。只填有出处的事实；未知字段写 [需确认] 并回到采集环节。
# 复制本文件到工作区并改名为 source.yaml；禁止手改渲染产物。
#
# 文本内 **双星号** 表示加粗，用于 bullet 的 4–8 字扫读小标题与行内标签。
# 渲染：python scripts/build_resume.py source.yaml --out apps/<date>-<version>
# 校验：python scripts/validate.py --deliver deliver --version apps/<date>-<version>

# ── 页眉（硬性）──────────────────────────────────────────────
name: "[需确认]"
intent: "[需确认：与 JD 岗位名逐字一致]"
availability: "[需确认：到岗时间 ｜ 每周天数 ｜ 城市]"
contacts:
  - "[需确认：电话，按 138-0000-0000 分段]"
  - "[需确认：邮箱]"
  # - "github.com/[需确认]"

# 输出文件名 stem；缺省为 「姓名_求职意向」去掉非法字符。
# 例如 张三_Java后端实习_2027届
# output_stem: "张三_Java后端实习_2027届"

# 证件照相对路径；文件不存在时自动不留空框、左栏占满。
# photo: photo.jpg

# ── 版式（可选，规则 R14）────────────────────────────────────
# 删掉弱相关内容后行数变少，用这两个字段把一页撑匀，不要塞水货。
leading: 0.52em
spacing: relaxed

# 主题色与字体均可选；字体缺省按操作系统探测中文字体。
# theme:
#   font: "Microsoft YaHei"
#   ink: "1f2328"
#   accent: "1f4e79"
#   muted: "5f6b7a"
#   rule: "d8dee6"

# R3：标准板块顺序。只允许 education / projects / skills，有实习可加 internship。
section_order: [education, projects, skills]

# 不设 summary / 置顶个人优势板块（R5）。

# ── 教育背景（R2 / R4）───────────────────────────────────────
# highlights 最多 3 行；奖项 / 论文 / 软著 / 横向课题压成带行内标签的略写行，
# 不展开 bullet、不带争议数字、不自造板块名。
education:
  - school: "[需确认]"
    major: "[需确认] · 本科（[需确认] 届）"
    period: "[需确认] – [需确认]"
    highlights:
      - "**GPA [需确认]，专业排名 [需确认]**，[需确认：奖学金]"
      - "**科研与成果**｜[需确认：论文 / 软著 / 竞赛，含真实状态]"
      # - "**实践与交付**｜[需确认：横向课题或独立交付的一行事实]"

# ── 专业技能（R6 / R8 / R9）──────────────────────────────────
# 6 行左右，按岗位匹配度排序，第一行必须是该岗位最核心的语言与框架。
# 程度词三级：熟悉=有源码落点 / 理解=知识层必考但项目无实现 / 了解=只划认知边界。
# 技能栏不写实现级细节词，不复述项目 bullet 里的机制；全篇 0 个「精通」。
skills:
  - label: "[核心语言]"
    details: "[需确认]"
  - label: "[核心框架]"
    details: "[需确认]"
  - label: "[数据存储]"
    details: "[需确认]"
  - label: "[中间件]"
    details: "[需确认]"
  - label: "[接口与安全]"
    details: "[需确认]"
  - label: "[工程化]"
    details: "[需确认]"

# ── 项目经历（R1 / R5 / R11）─────────────────────────────────
# 100% 同技术栈；跨方向项目整块删除，不要标语言标签保留。
# 每条 bullet：针对 [问题/约束] → 采用 [方案 + 关键技术 + 参数] → 得到 [可核验结果或明确边界]，
# 且至少一处「为什么 / 边界 / 代价」。渲染 ≤ 2 行，一条 bullet 一个可追问考点。
projects:
  - name: "[需确认]"
    tag: "[需确认：岗位方向 · 交付方式]"
    period: "[需确认] – [需确认]"
    tech: "[需确认：逐项确认真实用过]"
    desc: >-
      [需确认：最小业务锚点 + 后端定位 + 风险清单，不写业务流程叙述、不写工作总结]
    bullets:
      - "**[4–8 字小标题]**：针对 [问题]，用 [方案 + 参数] 得到 [结果或边界]；[为什么这么选 / 代价]"
      - "**[4–8 字小标题]**：针对 [问题]，用 [方案 + 参数] 得到 [结果或边界]；[降级或遗留问题]"
      # 目标 8–10 条，项目板块占全文 ≥ 60% 字符。

# ── 实习经历（可选；有则把 internship 加进 section_order）──────
# internship:
#   - name: "[需确认]"
#     tag: "[需确认]"
#     period: "[需确认]"
#     tech: "[需确认]"
#     desc: "[需确认]"
#     bullets:
#       - "**[小标题]**：[PQR + 为什么/边界/代价]"
