# 岗位词表 · 复制到工作区改名为 role-profile.yaml 后填写
# 用法：python scripts/validate.py --deliver deliver --version apps/<v> --role-profile role-profile.yaml
# 只放「有出处」的词：p0_words 的权重来源写在 weight_sources；off_stack_words 来自用户本人的跨方向经历。

role: "[目标岗位，例如 Java 后端开发实习生]"

# 权重来源：JD 条目编号、面经 URL、岗位专项检索 URL，必须可核验。
weight_sources:
  - "jd.md 第 2–7 条任职要求"
  # - "https://... （检索日期）"

# 地基类必考词。校验器检查全文是否逐字命中；不提供本字段时跳过该项。
# 注意：这是覆盖率参考，不是堆词目标；为凑命中率加词会触发 R10 难度闸门失败。
p0_words:
  - "示例词一"
  - "示例词二"

# 与目标岗位无关、不得出现在「项目经历」板块的技术名 / 工具 / 项目名 / 成果名。
# 校验器按板块扫描，项目板块命中数须为 0；教育背景略写行允许事实性名称命中。
off_stack_words:
  - "示例跨方向技术"

# 禁止出现的自造板块名（R2）。缺省使用标准黑名单。
banned_sections:
  - "补充信息"
  - "其他信息"
  - "荣誉奖项"
  - "科研与荣誉"

# 标准板块顺序（R3）。有实习时可写 [education, internship, projects, skills]。
section_order: [education, projects, skills]

# 项目板块字符占比下限（R3），缺省 60。
min_project_ratio: 60
